<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Urban Style | Ropa urbana online</title>
    <meta
      name="description"
      content="Remeras, buzos, pantalones y camperas para combinar a tu manera. Elegí talle y color y hacé tu pedido por WhatsApp."
    />
    <link rel="canonical" href="https://iest-tfiurban-style.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Urban Style" />
    <meta property="og:title" content="Urban Style | Ropa urbana online" />
    <meta
      property="og:description"
      content="Remeras, buzos, pantalones y camperas para combinar a tu manera. Elegí talle y color y hacé tu pedido por WhatsApp."
    />
    <meta property="og:image" content="https://iest-tfiurban-style.vercel.app/img/compartir.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/img/marca/isotipo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Montserrat:wght@700&display=swap"
    />
    <link rel="stylesheet" href="/css/globales.css" />
    <link rel="stylesheet" href="/css/componentes/encabezado.css" />
    <link rel="stylesheet" href="/css/componentes/pie-de-pagina.css" />
    <link rel="stylesheet" href="/css/componentes/boton.css" />
    <link rel="stylesheet" href="/css/componentes/mensaje.css" />
    <link rel="stylesheet" href="/css/componentes/tarjeta-producto.css" />
    <link rel="stylesheet" href="/css/paginas/inicio.css" />
    <script type="module" src="/js/paginas/inicio.js"></script>
  </head>
  <body>
    <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

    <header class="encabezado">
      <div class="contenedor encabezado-interior">
        <a class="encabezado-logo" href="/">
          <img src="/img/marca/logo.svg" alt="Urban Style" width="168" height="40" />
        </a>

        <button
          class="encabezado-boton-menu"
          type="button"
          aria-expanded="false"
          aria-controls="menu-principal"
          data-boton-menu
          hidden
        >
          Menú
        </button>

        <nav class="encabezado-nav" id="menu-principal" aria-label="Principal" data-navegacion>
          <ul class="encabezado-enlaces">
            <li><a class="encabezado-enlace" href="/">Inicio</a></li>
            <li><a class="encabezado-enlace" href="/catalogo.html">Catálogo</a></li>
          </ul>
        </nav>

        <a class="encabezado-carrito" href="/carrito.html">
          Carrito
          <span class="encabezado-contador" id="contador-carrito">0</span>
          <span class="visualmente-oculto">productos</span>
        </a>
      </div>
    </header>

    <main id="contenido">
      <section class="inicio-banner" aria-labelledby="titulo-inicio">
        <div class="contenedor">
          <h1 class="inicio-banner-titulo" id="titulo-inicio">Tu estilo, tus reglas</h1>
          <p class="inicio-banner-texto">Encontrá tu próximo look y combiná las prendas a tu manera.</p>
          <a class="boton boton-oscuro" href="/catalogo.html">Ver catálogo</a>
        </div>
      </section>

      <div class="contenedor" id="avisos-inicio"></div>

      <section class="contenedor inicio-seccion" id="seccion-destacados" aria-labelledby="titulo-destacados" hidden>
        <h2 id="titulo-destacados">Destacados</h2>
        <div id="destacados"></div>
      </section>

      <section class="contenedor inicio-seccion" aria-labelledby="titulo-categorias">
        <h2 id="titulo-categorias">Categorías</h2>
        <ul class="inicio-categorias" id="categorias"></ul>
      </section>
    </main>

    <footer class="pie-de-pagina">
      <div class="contenedor pie-de-pagina-interior">
        <a class="pie-de-pagina-logo" href="/">
          <img src="/img/marca/logo-oscuro.svg" alt="Urban Style" width="168" height="40" loading="lazy" />
        </a>

        <nav aria-label="Pie de página" data-navegacion>
          <ul class="pie-de-pagina-enlaces">
            <li><a class="pie-de-pagina-enlace" href="/">Inicio</a></li>
            <li><a class="pie-de-pagina-enlace" href="/catalogo.html">Catálogo</a></li>
            <li><a class="pie-de-pagina-enlace" href="/carrito.html">Carrito</a></li>
          </ul>
        </nav>

        <p class="pie-de-pagina-legal">© 2026 Urban Style · Tienda de demostración</p>
      </div>
    </footer>
  </body>
</html>
